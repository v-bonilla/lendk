name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    if: github.ref != 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pass gnupg
      - run: make check

  docker:
    if: github.ref != 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - run: make check-docker

  bench:
    if: github.ref != 'refs/heads/dev'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pass gnupg
      - run: make bench

  macos:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - run: brew install bash gnupg pass
      - name: diag
        timeout-minutes: 3
        continue-on-error: true
        env:
          BATS_TEST_TIMEOUT: 40
        run: |
          ( for i in $(seq 1 60); do echo "== $i"; ps -A -o pid,ppid,pgid,tpgid,stat,command | grep -E 'lendk|fake-pass|stub|read -r|bash --norc' | grep -v grep | cut -c1-160; sleep 0.25; done ) >/tmp/ps.log 2>&1 &
          test/lib/bats-core/bin/bats --filter 'pipeline neighbor that reads' test/signals.bats || true
          cat /tmp/ps.log
      - run: make test
        timeout-minutes: 20
        env:
          BATS_TEST_TIMEOUT: 60
