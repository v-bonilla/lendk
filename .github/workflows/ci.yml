name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    if: github.ref != 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pass gnupg
      - run: make check

  docker:
    if: github.ref != 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - run: make check-docker

  bench:
    if: github.ref != 'refs/heads/dev'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pass gnupg
      - run: make bench

  macos:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - run: brew install bash gnupg pass
      - name: diag
        run: |
          bash --version | head -1; gpg --version | head -1
          d=$(mktemp -d); export HOME=$d/home LENDK_SHIMS=$d/shims PASSWORD_STORE_DIR=$d/store
          mkdir -p $HOME/.config/lendk $d/store/env; chmod 700 $HOME/.config/lendk; echo K >$d/store/env/K1.gpg
          ln -s /bin/ls $d/ls1; export PATH=$d:$PATH
          bash -x bin/lendk add ls1 K1 2>&1 | tail -80 || true
          ls -la $d/shims || true
      - run: make test
