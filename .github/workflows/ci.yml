name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    if: github.ref != 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pass gnupg
      - run: make check

  docker:
    if: github.ref != 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - run: make check-docker

  bench:
    if: github.ref != 'refs/heads/dev'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pass gnupg
      - run: make bench

  macos:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - run: brew install bash gnupg pass
      - name: diag
        run: |
          d=$(mktemp -d); mkdir -m 700 $d/shims; t=$d/shims/.tmp.1
          set -x
          (builtin umask 077 && builtin printf '%s' hi >"$t"); echo "printf=$?"
          command -p chmod 755 -- "$t"; echo "chmod=$?"
          command -p mv -f -- "$t" $d/shims/x; echo "mv=$?"
          command -p ls -ln -- $d/shims/x; echo "ls=$?"
          command -V chmod mv ls; getconf PATH || true
          true
      - run: make test
