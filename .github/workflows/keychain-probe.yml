# PROTOTYPE for #34, throwaway: runs the keychain probe on the macOS runners. It lives only on prototype/keychain-cache, which never merges.
name: keychain-probe

on:
  push:
    branches: [prototype/keychain-cache]

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: prototypes/34-keychain-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner's account is a throwaway VM, which is what the guard file asserts.
      - run: touch ~/KEYCHAIN-PROBE-THROWAWAY
      - run: ./probe.sh build
      - run: PROBE_CI=1 ./probe.sh ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: keychain-probe-${{ matrix.os }}
          path: prototypes/34-keychain-cache/results/
